<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Nice Furniture</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <header class="site-header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                Nice Furniture
            </a>

            <nav class="nav-menu">

                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="categories.html">Categories</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>

            </nav>

            <div class="nav-actions">

                <a href="cart.html" class="cart-link">
                    Cart
                </a>

                <button class="menu-btn" aria-label="Open menu">
                    ☰
                </button>

            </div>

        </div>

    </header>


    <main>

        <!-- Shop Header -->

        <section class="shop-header">

            <div class="container">

                <p class="section-label">
                    OUR COLLECTION
                </p>

                <h1>
                    Shop Furniture
                </h1>

                <p>
                    Discover furniture designed to make
                    your space comfortable and beautiful.
                </p>

            </div>

        </section>


        <!-- Shop Content -->

        <section class="shop">

            <div class="container">

                <div class="shop-layout">

                    <!-- Filters will go here -->

                   <div class="shop-filters">

    <!-- Mobile filter button -->
    <button
        type="button"
        class="mobile-filter-btn"
        id="mobile-filter-btn"
    >
        Filter Categories
    </button>

    <!-- Filter panel -->
    <aside class="filter-panel" id="filter-panel">

        <div class="filter-panel-header">

            <h2>Categories</h2>

            <button
                type="button"
                id="close-filter"
                aria-label="Close filters"
            >
                ×
            </button>

        </div>

        <!-- Desktop heading -->
        <h2 class="desktop-filter-title">
            Categories
        </h2>

        <div class="filter-options">

            <button
                class="filter-btn active"
                data-category="all"
            >
                All Products
            </button>

            <button
                class="filter-btn"
                data-category="chairs"
            >
                Chairs
            </button>

            <button
                class="filter-btn"
                data-category="sofas"
            >
                Sofas
            </button>

            <button
                class="filter-btn"
                data-category="tables"
            >
                Tables
            </button>

            <button
                class="filter-btn"
                data-category="beds"
            >
                Beds
            </button>

        </div>

    </aside>

</div>


                    <!-- Products will go here -->

                    <div class="shop-products">

<div class="shop-toolbar">

    <p id="product-count">
        6 Products
    </p>

    <div class="shop-controls">

        <input
            type="search"
            id="search-input"
            placeholder="Search furniture..."
        >

        <select id="sort-select">

            <option value="default">
                Sort By
            </option>

            <option value="price-low">
                Price: Low to High
            </option>

            <option value="price-high">
                Price: High to Low
            </option>

            <option value="name">
                Name: A to Z
            </option>

        </select>

    </div>

</div>

                        <div class="product-grid"  id="shop-products">
                            <!-- JavaScript will generate products -->
                        </div>

                        <div class="pagination" id="pagination">
                             <!-- Pagination buttons will be generated by JavaScript -->
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <div class="footer-bottom">

                <p>
                    &copy; 2026 Nice Furniture.
                    All rights reserved.
                </p>

                <p>
                    Privacy Policy Terms & Conditions
                </p>

            </div>

        </div>

    </footer>


    <script src="javaScript/products.js"></script>
    <script src="javaScript/main.js"></script>
    <script src="javaScript/shop.js"></script>

</body>

</html>
